<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<title>CityFeed — CityLedger</title>
<link href="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/css/city-connect-wcopilot.webflow.633e33f7b.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f7fa}
.fb{max-width:1140px;margin:0 auto;padding:100px 24px 80px}

/* Header */
.fh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
.fh h1{font-family:'Urbanist',sans-serif;font-size:2.1rem;font-weight:900;color:#0f1f3d;letter-spacing:-0.5px}
.fh p{color:#64748b;font-size:.86rem;margin-top:5px}
.fab{background:linear-gradient(135deg,#0f3460,#1e4e8c);color:#fff;padding:11px 22px;border-radius:10px;font-family:'Urbanist',sans-serif;font-weight:700;font-size:.9rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s;box-shadow:0 4px 14px rgba(15,52,96,.25)}
.fab:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,52,96,.3)}

/* GPS bar */
.gbar{background:#fff;border-radius:12px;padding:10px 18px;margin-bottom:20px;font-size:.85rem;color:#475569;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1px solid #e9eef5}
.gbar button{background:#0f3460;color:#fff;border:none;padding:5px 14px;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif}

/* Category tabs */
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;padding:7px 18px;border-radius:20px;border:2px solid #e2e8f0;background:#fff;color:#64748b;font-family:'Urbanist',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;transition:.15s;white-space:nowrap}
.ctab:hover{border-color:#0f3460;color:#0f3460}
.ctab.active{background:#0f3460;color:#fff;border-color:#0f3460}

/* Sort bar */
.sbar{display:flex;gap:8px;align-items:center;margin-bottom:24px}
.spill{padding:6px 14px;border-radius:20px;border:2px solid #e2e8f0;background:#fff;color:#64748b;font-family:'Urbanist',sans-serif;font-weight:700;font-size:.78rem;text-decoration:none;white-space:nowrap;transition:.15s}
.spill:hover,.spill.active{background:#0f3460;color:#fff;border-color:#0f3460}

/* Card grid */
.feed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}

/* Card */
.feed-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);cursor:pointer;transition:all .22s;display:flex;flex-direction:column;border:1px solid #eef1f6}
.feed-card:hover{transform:translateY(-5px);box-shadow:0 14px 40px rgba(0,0,0,.12);border-color:#dce4f0}

/* Severity top stripe */
.sev-stripe{height:4px;width:100%}
.sev-CRITICAL .sev-stripe{background:linear-gradient(90deg,#dc2626,#f87171)}
.sev-HIGH .sev-stripe{background:linear-gradient(90deg,#ea580c,#fb923c)}
.sev-MEDIUM .sev-stripe{background:linear-gradient(90deg,#ca8a04,#facc15)}
.sev-LOW .sev-stripe,.sev-null .sev-stripe{background:linear-gradient(90deg,#2563eb,#60a5fa)}

/* Image zone */
.feed-img-wrap{position:relative;width:100%;height:220px;overflow:hidden;flex-shrink:0}
.feed-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.feed-card:hover .feed-img-wrap img{transform:scale(1.05)}
.feed-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.sev-CRITICAL .feed-img-ph{background:linear-gradient(135deg,#fff5f5,#fee2e2)}
.sev-HIGH .feed-img-ph{background:linear-gradient(135deg,#fff7ed,#ffedd5)}
.sev-MEDIUM .feed-img-ph{background:linear-gradient(135deg,#fefce8,#fef9c3)}
.sev-LOW .feed-img-ph,.sev-null .feed-img-ph{background:linear-gradient(135deg,#eff6ff,#dbeafe)}
.feed-cat-badge{font-family:'Urbanist',sans-serif;font-weight:800;font-size:.88rem;color:#475569;text-transform:uppercase;letter-spacing:.5px;padding:8px 16px;background:rgba(255,255,255,.75);border-radius:8px;border:1px solid rgba(0,0,0,.08)}

/* Severity badge top-left */
.img-sev{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:800;font-family:'Urbanist',sans-serif;backdrop-filter:blur(6px);z-index:2;letter-spacing:.4px}
.sev-CRITICAL .img-sev{background:rgba(220,38,38,.9);color:#fff}
.sev-HIGH .img-sev{background:rgba(234,88,12,.9);color:#fff}
.sev-MEDIUM .img-sev{background:rgba(202,138,4,.9);color:#fff}
.sev-LOW .img-sev,.sev-null .img-sev{background:rgba(37,99,235,.9);color:#fff}

/* Upvote pill — top right of image */
.upvote-pill{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:5px;padding:5px 12px 5px 10px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:20px;border:none;cursor:pointer;font-family:'Urbanist',sans-serif;font-weight:800;font-size:.8rem;color:#374151;box-shadow:0 2px 10px rgba(0,0,0,.12);transition:all .2s;z-index:2}
.upvote-pill:hover{background:#fff;transform:scale(1.05);box-shadow:0 4px 14px rgba(0,0,0,.16)}
.upvote-pill.upvoted{background:#0f3460;color:#fff}
.upvote-pill.upvoted .pill-arrow{color:#fff}
.pill-arrow{font-size:.9rem;line-height:1;color:#0f3460;transition:color .2s}
.upvote-pill.upvoted .pill-arrow{color:#fff}
.pill-count{font-size:.82rem;font-weight:800}

/* Card body */
.feed-body{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column;gap:8px}
.feed-title{font-family:'Urbanist',sans-serif;font-weight:800;font-size:1rem;color:#0f1f3d;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed-loc{font-size:.8rem;color:#64748b;display:flex;align-items:center;gap:4px}
.feed-loc-text{color:#0f3460;font-weight:600}
.feed-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid #f1f5f9}
.feed-status{padding:3px 10px;border-radius:6px;font-size:.7rem;font-weight:700;font-family:'Urbanist',sans-serif;letter-spacing:.3px}
.status-FILED{background:#f0f4ff;color:#1d4ed8}
.status-IN_PROGRESS{background:#fff7ed;color:#c2410c}
.status-RESOLVED{background:#f0fdf4;color:#15803d}
.status-CLOSED{background:#f8fafc;color:#64748b}
.feed-meta-row{display:flex;align-items:center;gap:10px;font-size:.77rem;color:#94a3b8}
.feed-comments{display:flex;align-items:center;gap:3px}
.feed-similar{color:#f59e0b;font-weight:700}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:#94a3b8;grid-column:1/-1}
.empty h3{font-family:'Urbanist',sans-serif;font-size:1.2rem;color:#64748b;margin-bottom:8px}

@media(max-width:600px){.feed-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="fb">

  <!-- Header -->
  <div class="fh">
    <div>
      <h1>CityFeed</h1>
      <p>Community-reported civic issues · AI-sorted by category</p>
    </div>
  </div>

  <!-- GPS bar -->
  <div class="gbar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f3460" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    <span th:if="${lat != null}">Showing within <strong th:text="${currentRadius}">5</strong>km · <a href="/citizen/feed" style="color:#0f3460;font-weight:700;text-decoration:none">Show all</a></span>
    <span th:if="${lat == null}" style="flex:1">Showing all recent complaints</span>
    <button th:if="${lat == null}" onclick="useGPS()" id="gpsBtn">📍 Use My Location</button>
  </div>

  <div class="cat-tabs">
    <button class="ctab active" onclick="filterTab(this,'all')">All</button>
    <button class="ctab" onclick="filterTab(this,'Pothole')">🕳 Pothole</button>
    <button class="ctab" onclick="filterTab(this,'Garbage')">🗑 Garbage</button>
    <button class="ctab" onclick="filterTab(this,'Street Lamp')">💡 Street Lamp</button>
    <button class="ctab" onclick="filterTab(this,'Water')">💧 Water</button>
    <button class="ctab" onclick="filterTab(this,'Road Damage')">🛣 Road</button>
    <button class="ctab" onclick="filterTab(this,'other')">Other</button>
  </div>

  <!-- Sort bar -->
  <div class="sbar">
    <a th:href="@{/citizen/feed(lat=${lat},lon=${lon},radius=${currentRadius},sort='latest',category=${currentCategory})}"
       th:classappend="${currentSort=='latest'}?' active':''" class="spill">Latest</a>
    <a th:href="@{/citizen/feed(lat=${lat},lon=${lon},radius=${currentRadius},sort='upvotes',category=${currentCategory})}"
       th:classappend="${currentSort=='upvotes'}?' active':''" class="spill">Most Upvoted</a>
    <a th:href="@{/citizen/feed(lat=${lat},lon=${lon},radius=${currentRadius},sort='critical',category=${currentCategory})}"
       th:classappend="${currentSort=='critical'}?' active':''" class="spill">Critical First</a>
  </div>

  <!-- Card grid -->
  <div class="feed-grid" id="grid">
    <div th:if="${#lists.isEmpty(feed)}" class="empty">
      <h3>No complaints yet</h3>
      <p>Be the first to report a civic issue.</p>
    </div>

    <div th:each="c : ${feed}"
         th:class="'feed-card sev-' + ${c.severity != null ? c.severity : 'LOW'}"
         th:data-category="${c.category}"
         th:data-id="${c.id}"
         th:data-upvoted="${upvotedByMe != null and upvotedByMe[c.id] != null ? upvotedByMe[c.id] : false}"
         th:data-votes="${c.upvoteCount}"
         onclick="location.href='/citizen/feed/' + this.dataset.id">

      <!-- Severity stripe -->
      <div class="sev-stripe"></div>

      <!-- Image zone -->
      <div class="feed-img-wrap">
        <img th:if="${c.mediaUrl != null and c.mediaUrl != 'null' and c.mediaUrl != ''}"
             th:src="${#strings.arraySplit(c.mediaUrl, ',')[0]}"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <div class="feed-img-ph"
             th:style="${c.mediaUrl != null and c.mediaUrl != 'null' and c.mediaUrl != '' ? 'display:none;' : 'display:flex;'}"
             th:data-cat="${c.category}">
          <div class="feed-cat-badge" th:text="${c.category != null ? c.category : 'General'}">Category</div>
        </div>

        <!-- Severity badge top-left -->
        <span class="img-sev" th:text="${c.severity != null ? c.severity : 'LOW'}"></span>

        <!-- Upvote pill top-right -->
        <button class="upvote-pill"
                th:class="'upvote-pill' + (${upvotedByMe != null and upvotedByMe[c.id] != null and upvotedByMe[c.id]} ? ' upvoted' : '')"
                th:data-id="${c.id}"
                th:data-votes="${c.upvoteCount}"
                onclick="event.stopPropagation();quickUpvote(this)">
          <span class="pill-arrow">▲</span>
          <span class="pill-count" th:text="${c.upvoteCount}">0</span>
        </button>
      </div>

      <!-- Card body -->
      <div class="feed-body">
        <div class="feed-title" th:text="${c.title}">Complaint Title</div>

        <div class="feed-loc">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="feed-loc-text" th:text="${c.location != null ? #strings.abbreviate(c.location,42) : 'Unknown location'}">Location</span>
        </div>

        <div class="feed-foot">
          <span class="feed-status"
                th:class="'feed-status status-' + ${c.status}"
                th:text="${c.status}">FILED</span>
          <div class="feed-meta-row">
            <span class="feed-comments">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span th:text="${commentCounts != null and commentCounts[c.id] != null ? commentCounts[c.id] : 0}">0</span>
            </span>
            <span th:if="${duplicateCounts != null and duplicateCounts[c.id] != null}"
                  class="feed-similar"
                  th:text="'+ ' + ${duplicateCounts[c.id]} + ' similar'"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
var CSRF = document.querySelector('meta[name="_csrf"]').content;
var CHEAD = document.querySelector('meta[name="_csrf_header"]').content;
var MAJOR = ['Pothole','Garbage','Street Lamp','Water Leakage','Water Supply','Road Damage'];

// Quick upvote from card pill button
function quickUpvote(btn){
  btn.disabled = true;
  var id = btn.dataset.id;
  fetch('/api/feed/upvote?complaintId='+id, {method:'POST', headers:{[CHEAD]:CSRF}})
  .then(function(r){return r.json();})
  .then(function(d){
    btn.classList.toggle('upvoted', d.upvoted);
    btn.querySelector('.pill-count').textContent = d.count;
    btn.dataset.votes = d.count;
  })
  .finally(function(){btn.disabled = false;});
}

// Category tab filter
function filterTab(btn, filter){
  document.querySelectorAll('.ctab').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  document.querySelectorAll('.feed-card').forEach(function(c){
    var cat = c.dataset.category || '';
    var show = false;
    if(filter === 'all'){show = true;}
    else if(filter === 'Water'){show = cat === 'Water Leakage' || cat === 'Water Supply';}
    else if(filter === 'other'){show = !MAJOR.includes(cat);}
    else{show = cat === filter;}
    c.style.display = show ? '' : 'none';
  });
}

// GPS
function useGPS(){
  var btn = document.getElementById('gpsBtn');
  btn.textContent = '⏳ Locating…';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(function(p){
    var u = new URL(location.href);
    u.searchParams.set('lat', p.coords.latitude.toFixed(6));
    u.searchParams.set('lon', p.coords.longitude.toFixed(6));
    u.searchParams.set('radius','5');
    location.href = u;
  }, function(){btn.textContent = '📍 Denied'; btn.disabled = false;});
}
</script>
</body>
</html>
