<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <title th:text="'Task #' + ${task != null ? task.id : '—'} + ' - CityLedger'">Task Detail - CityLedger</title>
    <link href="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/css/city-connect-wcopilot.webflow.633e33f7b.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Lato', sans-serif; background: #f4f7f6; margin: 0; }
        .dash-body { padding: 120px 5% 80px 5%; min-height: 70vh; max-width: 900px; margin: 0 auto; }
        h2 { font-family: 'Urbanist', sans-serif; color: #1a1a2e; font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #666; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #0f3460; }

        .detail-card { background: white; border-radius: 16px; padding: 36px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .detail-header h3 { font-family: 'Urbanist', sans-serif; font-size: 1.5rem; color: #0f3460; font-weight: 800; margin: 0; }

        .badge { display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; }
        .severity-LOW { background: #e0f2fe; color: #0284c7; }
        .severity-HIGH { background: #fed7aa; color: #c2410c; }
        .severity-CRITICAL { background: #fee2e2; color: #dc2626; }
        .status-FILED { background: #fee2e2; color: #991b1b; }
        .status-IN_PROGRESS { background: #fef08a; color: #a16207; }
        .status-RESOLVED { background: #dcfce7; color: #166534; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .info-item { background: #f8fafc; border-radius: 10px; padding: 16px; }
        .info-item .label { font-size: 0.85rem; color: #666; margin-bottom: 4px; font-weight: 600; }
        .info-item .value { font-weight: 700; color: #1a1a2e; word-break: break-all; }

        .description-block { background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 24px; line-height: 1.7; color: #333; }
        .description-block h4 { font-family: 'Urbanist', sans-serif; font-weight: 800; color: #1a1a2e; margin: 0 0 8px; }

        .nav-btn { display: inline-flex; align-items: center; gap: 10px; background: #0f3460; color: white; padding: 14px 28px; border-radius: 10px; text-decoration: none; font-weight: 700; font-family: 'Urbanist', sans-serif; transition: all 0.2s; margin-bottom: 24px; }
        .nav-btn:hover { background: #16213e; transform: translateY(-2px); }

        .sla-block { display: flex; align-items: center; gap: 12px; background: #fefce8; border: 1px solid #fde68a; padding: 16px 20px; border-radius: 12px; margin-bottom: 24px; }
        .sla-block .sla-timer { font-family: 'Urbanist', sans-serif; font-weight: 800; font-size: 1.3rem; }
        .sla-green { color: #16a34a; }
        .sla-yellow { color: #ca8a04; }
        .sla-red { color: #dc2626; }
        .sla-blink { color: #dc2626; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Status action buttons */
        .action-bar { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 20px; border-top: 2px solid #f0f0f0; }
        .action-btn { padding: 14px 28px; border-radius: 10px; border: none; font-weight: 700; font-family: 'Urbanist', sans-serif; font-size: 1rem; cursor: pointer; transition: all 0.2s; flex: 1; text-align: center; }
        .action-btn:hover { transform: translateY(-2px); }
        .btn-progress { background: #ca8a04; color: white; }
        .btn-progress:hover { background: #a16207; }
        .btn-done { background: #16a34a; color: white; }
        .btn-done:hover { background: #15803d; }
        .btn-disabled { background: #e5e7eb; color: #9ca3af; cursor: default; }
        .btn-disabled:hover { transform: none; }

        .alert-success { background: #dcfce7; color: #166534; padding: 14px 20px; border-radius: 12px; margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }

        .upload-area { border: 2px dashed #d1d5db; border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fafafa; margin-bottom: 16px; }
        .upload-area:hover { border-color: #16a34a; background: #f0fdf4; }
        .upload-area input { display: none; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dash-body">
        <a href="/field-worker/tasks" class="back-link">← Back to Tasks</a>

        <div th:if="${param.updated}" class="alert-success">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Task status updated successfully!
        </div>

        <div th:if="${task != null}">
            <div class="detail-card">
                <div class="detail-header">
                    <h3 th:text="'#CL-' + ${task.id} + ' — ' + ${task.title}"></h3>
                    <div style="display: flex; gap: 8px;">
                        <span th:class="'badge status-' + ${task.status.name()}" th:text="${task.status}"></span>
                        <span th:if="${task.severity != null}" th:class="'badge severity-' + ${task.severity}" th:text="${task.severity}"></span>
                    </div>
                </div>

                <div class="sla-block">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ca8a04" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span style="font-weight: 600; color: #666;">SLA Remaining:</span>
                    <span class="sla-timer" th:data-created="${task.createdAt}">—</span>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <div class="label">Category</div>
                        <div class="value" th:text="${task.category != null ? task.category : 'Unassigned'}"></div>
                    </div>
                    <div class="info-item">
                        <div class="label">Citizen</div>
                        <div class="value" th:text="${task.citizen.name}"></div>
                    </div>
                    <div class="info-item">
                        <div class="label">Filed On</div>
                        <div class="value" th:text="${#temporals.format(task.createdAt, 'MMM dd, yyyy HH:mm')}"></div>
                    </div>
                    <div class="info-item">
                        <div class="label">Location</div>
                        <div class="value" th:text="${task.location}"></div>
                    </div>
                </div>

                <a th:href="'https://www.google.com/maps/search/?api=1&query=' + ${task.location}" target="_blank" class="nav-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
                    Navigate in Google Maps
                </a>

                <div class="description-block">
                    <h4>Complaint Description</h4>
                    <p th:text="${task.description}" style="margin: 0;"></p>
                </div>

                <!-- Photo upload for completion -->
                <div th:if="${task.status.name() == 'IN_PROGRESS'}">
                    <h4 style="font-family: 'Urbanist', sans-serif; font-weight: 800; color: #1a1a2e; margin: 0 0 12px;">Completion Photo (required)</h4>
                    <div class="upload-area" onclick="document.getElementById('completionPhoto').click()">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <p style="color: #999; margin: 8px 0 0; font-size: 0.9rem;">Click to upload proof of completion</p>
                        <input type="file" id="completionPhoto" accept="image/*">
                    </div>
                    <div id="photoPreview" style="margin-bottom: 16px;"></div>
                </div>

                <!-- Action buttons -->
                <div class="action-bar">
                    <form th:if="${task.status.name() == 'FILED'}" th:action="@{/field-worker/task/{id}/status(id=${task.id})}" method="post" style="flex: 1; margin: 0;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="newStatus" value="IN_PROGRESS" />
                        <button type="submit" class="action-btn btn-progress" style="width: 100%;">Accept & Start Work</button>
                    </form>

                    <form th:if="${task.status.name() == 'IN_PROGRESS'}" th:action="@{/field-worker/task/{id}/status(id=${task.id})}" method="post" style="flex: 1; margin: 0;" id="doneForm">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="newStatus" value="RESOLVED" />
                        <button type="submit" class="action-btn btn-done" style="width: 100%;" onclick="return validatePhoto()">Mark as Done</button>
                    </form>

                    <div th:if="${task.status.name() == 'RESOLVED'}" style="flex: 1;">
                        <button class="action-btn btn-disabled" style="width: 100%;" disabled>Completed ✓</button>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${task == null}" style="text-align: center; padding: 80px;">
            <h3 style="font-family: 'Urbanist', sans-serif; color: #666;">Task not found</h3>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67a4c8dcc89e958da293d681" type="text/javascript"></script>
    <script src="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/js/webflow.2ed69b183.js" type="text/javascript"></script>
    <script>
        // SLA Timer
        document.querySelectorAll('.sla-timer').forEach(function(el) {
            var created = new Date(el.getAttribute('data-created'));
            var deadline = new Date(created.getTime() + 48 * 3600000);
            function update() {
                var diff = deadline - new Date();
                if (diff <= 0) { el.textContent = 'SLA BREACHED'; el.className = 'sla-timer sla-blink'; return; }
                var h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000);
                el.textContent = h + 'h ' + m + 'm remaining';
                el.className = 'sla-timer ' + (h > 24 ? 'sla-green' : h > 6 ? 'sla-yellow' : 'sla-red');
            }
            update(); setInterval(update, 60000);
        });

        // Photo preview
        var photoInput = document.getElementById('completionPhoto');
        if (photoInput) {
            photoInput.addEventListener('change', function(e) {
                var preview = document.getElementById('photoPreview');
                preview.innerHTML = '';
                if (e.target.files.length > 0) {
                    var reader = new FileReader();
                    reader.onload = function(ev) {
                        var img = document.createElement('img');
                        img.src = ev.target.result;
                        img.style.cssText = 'width:120px;height:120px;object-fit:cover;border-radius:12px;border:2px solid #16a34a;';
                        preview.appendChild(img);
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
        }

        function validatePhoto() {
            var photoInput = document.getElementById('completionPhoto');
            if (photoInput && photoInput.files.length === 0) {
                alert('Please upload a completion photo before marking this task as done.');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
