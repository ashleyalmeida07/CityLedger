<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<title>CityFeed — CityLedger</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;700;800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:#f0f2f5}
.fb{max-width:1100px;margin:0 auto;padding:100px 24px 80px}
/* Header */
.fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.fh h1{font-family:'Urbanist',sans-serif;font-size:2rem;font-weight:900;color:#0f3460}
.fh p{color:#64748b;font-size:.88rem;margin-top:4px}
.fab{background:#0f3460;color:#fff;padding:11px 22px;border-radius:10px;font-family:'Urbanist',sans-serif;font-weight:700;font-size:.9rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.fab:hover{background:#16213e;transform:translateY(-1px)}
/* GPS bar */
.gbar{background:#fff;border-radius:12px;padding:10px 18px;margin-bottom:16px;font-size:.85rem;color:#475569;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.gbar button{background:#0f3460;color:#fff;border:none;padding:5px 14px;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif}
/* Category tabs */
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;padding:8px 18px;border-radius:20px;border:2px solid #e2e8f0;background:#fff;color:#64748b;font-family:'Urbanist',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;transition:.15s;white-space:nowrap}
.ctab:hover{border-color:#0f3460;color:#0f3460}
.ctab.active{background:#0f3460;color:#fff;border-color:#0f3460}
/* Sort bar */
.sbar{display:flex;gap:8px;align-items:center;margin-bottom:20px}
.spill{padding:6px 14px;border-radius:20px;border:2px solid #e2e8f0;background:#fff;color:#64748b;font-family:'Urbanist',sans-serif;font-weight:700;font-size:.78rem;text-decoration:none;white-space:nowrap;transition:.15s}
.spill:hover,.spill.active{background:#0f3460;color:#fff;border-color:#0f3460}
/* Card grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ccard{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.ccard:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.12)}
.cbar{height:5px;width:100%}
.sev-CRITICAL .cbar{background:#dc2626}
.sev-HIGH .cbar{background:#ea580c}
.sev-MEDIUM .cbar{background:#ca8a04}
.sev-LOW .cbar,.sev-null .cbar{background:#2563eb}
.cbody{padding:18px;flex:1;display:flex;flex-direction:column;gap:8px}
.cemoji{font-size:1.8rem;line-height:1}
.ctitle{font-family:'Urbanist',sans-serif;font-weight:800;font-size:1rem;color:#0f3460;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cloc{font-size:.78rem;color:#94a3b8;display:flex;align-items:center;gap:4px}
.cbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sbadge{padding:3px 10px;border-radius:5px;font-size:.7rem;font-weight:700;font-family:'Urbanist',sans-serif}
.sbadge-CRITICAL{background:#fef2f2;color:#dc2626}
.sbadge-HIGH{background:#fff7ed;color:#ea580c}
.sbadge-MEDIUM{background:#fefce8;color:#ca8a04}
.sbadge-LOW{background:#eff6ff;color:#2563eb}
.statusb{background:#f1f5f9;color:#475569;padding:3px 10px;border-radius:5px;font-size:.7rem;font-weight:700;font-family:'Urbanist',sans-serif}
.cfoot{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:10px;border-top:1px solid #f8fafc;font-size:.8rem;color:#64748b}
.cthumb{width:100%;height:120px;object-fit:cover}
.ctime{margin-left:auto;font-size:.72rem}
/* Empty */
.empty{text-align:center;padding:60px 20px;color:#94a3b8;grid-column:1/-1}
.empty h3{font-family:'Urbanist',sans-serif;font-size:1.2rem;color:#64748b;margin-bottom:8px}
/* Overlay + Drawer */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;width:480px;max-width:100vw;height:100vh;background:#fff;z-index:9999;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 40px rgba(0,0,0,.15)}
.drawer.open{transform:translateX(0)}
.dhead{padding:20px 24px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:1}
.dclose{margin-left:auto;background:none;border:none;font-size:1.4rem;cursor:pointer;color:#94a3b8;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.dclose:hover{background:#f1f5f9}
.dbody{padding:24px}
.dcat{font-family:'Urbanist',sans-serif;font-weight:800;font-size:1.05rem;color:#0f3460}
.dtitle{font-family:'Urbanist',sans-serif;font-weight:900;font-size:1.4rem;color:#0f3460;line-height:1.25;margin-bottom:8px}
.dmeta{font-size:.82rem;color:#94a3b8;margin-bottom:16px}
.dmeta strong{color:#475569}
.ai-card{background:linear-gradient(135deg,#0f3460,#1a1a2e);border-radius:14px;padding:18px 20px;margin-bottom:18px;color:#fff}
.ai-chip{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:rgba(255,255,255,.5);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.ai-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;display:inline-block;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.ai-text{font-size:.9rem;color:rgba(255,255,255,.85);line-height:1.6}
.ddesc{font-size:.9rem;color:#475569;line-height:1.7;margin-bottom:18px}
.dvote{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;margin-bottom:20px}
.vbtn{display:inline-flex;align-items:center;gap:7px;padding:10px 24px;border-radius:8px;border:2px solid #e2e8f0;background:#fff;color:#374151;font-family:'Urbanist',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:.2s}
.vbtn:hover{border-color:#16a34a;color:#16a34a}
.vbtn.upvoted{background:#16a34a;color:#fff;border-color:#16a34a}
.vcnt{font-family:'Urbanist',sans-serif;font-size:1.4rem;font-weight:900;color:#0f3460}
.vlab{font-size:.75rem;color:#94a3b8}
.vmaplink{margin-left:auto;color:#0f3460;font-size:.82rem;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:4px;border:2px solid #e2e8f0;padding:6px 12px;border-radius:6px}
.coms-title{font-family:'Urbanist',sans-serif;font-weight:800;font-size:1rem;color:#0f3460;margin-bottom:14px}
.com{padding:12px 0;border-bottom:1px solid #f8fafc}
.com:last-of-type{border-bottom:none}
.cauth{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cavatar{width:30px;height:30px;border-radius:50%;background:#0f3460;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;font-family:'Urbanist',sans-serif;flex-shrink:0}
.caname{font-weight:700;font-size:.85rem;color:#374151}
.offb{background:#0f3460;color:#fff;padding:2px 7px;border-radius:4px;font-size:.6rem;font-weight:800;font-family:'Urbanist',sans-serif}
.ctime2{margin-left:auto;font-size:.72rem;color:#94a3b8}
.ctext{font-size:.88rem;color:#475569;line-height:1.6;padding-left:38px}
.cform{margin-top:18px;padding-top:16px;border-top:1px solid #f1f5f9}
.cinput{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:.88rem;font-family:'Lato',sans-serif;resize:vertical;min-height:72px;transition:.2s}
.cinput:focus{outline:none;border-color:#0f3460}
.csubmit{margin-top:8px;background:#0f3460;color:#fff;border:none;padding:9px 22px;border-radius:8px;font-family:'Urbanist',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer}
.dthumb{width:100%;border-radius:10px;max-height:200px;object-fit:cover;margin-bottom:16px}
.dloading{text-align:center;padding:40px;color:#94a3b8}
.chain-note{font-size:.72rem;color:#94a3b8;margin-top:12px}
.chain-note a{color:#2563eb;font-weight:700;text-decoration:none}
@media(max-width:600px){.drawer{width:100vw}.cgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="fb">

  <!-- Header -->
  <div class="fh">
    <div>
      <h1>🏙️ CityFeed</h1>
      <p>Community-reported civic issues · AI-sorted by category</p>
    </div>
    <a href="/citizen/report" class="fab">+ Report Issue</a>
  </div>

  <!-- GPS bar -->
  <div class="gbar">
    <span th:if="${lat != null}">📍 Showing within <strong th:text="${currentRadius}">5</strong>km · <a href="/citizen/feed" style="color:#0f3460;font-weight:700;text-decoration:none">Show all</a></span>
    <span th:if="${lat == null}" style="flex:1">📍 Showing all recent complaints</span>
    <button th:if="${lat == null}" onclick="useGPS()" id="gpsBtn">📡 Use My Location</button>
  </div>

  <!-- Category tabs -->
  <div class="cat-tabs">
    <button class="ctab active" onclick="filterTab(this,'all')">All</button>
    <button class="ctab" onclick="filterTab(this,'Pothole')">🕳️ Pothole</button>
    <button class="ctab" onclick="filterTab(this,'Garbage')">🗑️ Garbage</button>
    <button class="ctab" onclick="filterTab(this,'Street Lamp')">💡 Street Lamp</button>
    <button class="ctab" onclick="filterTab(this,'Water')">💧 Water</button>
    <button class="ctab" onclick="filterTab(this,'Road Damage')">🛣️ Road</button>
    <button class="ctab" onclick="filterTab(this,'other')">📋 Other</button>
  </div>

  <!-- Sort bar -->
  <div class="sbar">
    <a th:href="@{/citizen/feed(lat=${lat},lon=${lon},radius=${currentRadius},sort='latest',category=${currentCategory})}"
       th:classappend="${currentSort=='latest'}?' active':''" class="spill">Latest</a>
    <a th:href="@{/citizen/feed(lat=${lat},lon=${lon},radius=${currentRadius},sort='upvotes',category=${currentCategory})}"
       th:classappend="${currentSort=='upvotes'}?' active':''" class="spill">🔥 Most Upvoted</a>
    <a th:href="@{/citizen/feed(lat=${lat},lon=${lon},radius=${currentRadius},sort='critical',category=${currentCategory})}"
       th:classappend="${currentSort=='critical'}?' active':''" class="spill">🚨 Critical First</a>
  </div>

  <!-- Card grid -->
  <div class="cgrid" id="grid">
    <div th:if="${#lists.isEmpty(feed)}" class="empty">
      <h3>No complaints yet</h3>
      <p>Be the first to report a civic issue.</p>
    </div>
    <div th:each="c : ${feed}"
         th:classappend="'ccard sev-' + ${c.severity}"
         th:data-category="${c.category}"
         th:data-id="${c.id}"
         th:data-upvoted="${upvotedByMe[c.id]}"
         th:data-votes="${c.upvoteCount}"
         onclick="openDrawer(this.dataset.id)">
      <div class="cbar"></div>
      <div th:if="${c.mediaUrl != null and !c.mediaUrl.isBlank()}">
        <img class="cthumb" th:src="${#strings.split(c.mediaUrl,',')[0]}" alt="" onerror="this.style.display='none'" loading="lazy"/>
      </div>
      <div class="cbody">
        <div class="cemoji" th:data-cat="${c.category}">📋</div>
        <div class="ctitle" th:text="${c.title}">Title</div>
        <div class="cloc">📍 <span th:text="${c.location != null ? #strings.abbreviate(c.location,45) : ''}"></span></div>
        <div class="cbadges">
          <span class="sbadge" th:classappend="'sbadge-'+${c.severity}" th:text="${c.severity}">MED</span>
          <span class="statusb" th:text="${c.status}">FILED</span>
        </div>
        <div class="cfoot">
          <span>👍 <span class="vcount" th:text="${c.upvoteCount}">0</span></span>
          <span>💬 <span th:text="${commentCounts[c.id]}">0</span></span>
          <span class="ctime" th:data-time="${c.createdAt}"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>

<!-- Drawer -->
<div class="drawer" id="drawer">
  <div class="dhead">
    <span id="dCatEmoji" style="font-size:1.5rem">📋</span>
    <span class="dcat" id="dCat">Category</span>
    <button class="dclose" onclick="closeDrawer()">✕</button>
  </div>
  <div class="dbody" id="dBody">
    <div class="dloading">Loading…</div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
var CSRF = document.querySelector('meta[name="_csrf"]').content;
var CHEAD = document.querySelector('meta[name="_csrf_header"]').content;
var EMOJIS = {'Pothole':'🕳️','Street Lamp':'💡','Garbage':'🗑️','Water Leakage':'💧','Water Supply':'🚰','Road Damage':'🛣️','Tree Fall':'🌳','Noise':'🔊','Stray Animals':'🐕'};
var MAJOR = ['Pothole','Garbage','Street Lamp','Water Leakage','Water Supply','Road Damage'];

// Emoji enrichment
document.querySelectorAll('.cemoji[data-cat]').forEach(function(el){el.textContent=EMOJIS[el.dataset.cat]||'📋';});

// Time ago
function timeAgo(str){if(!str)return'';var d=new Date(str),s=(Date.now()-d)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
document.querySelectorAll('[data-time]').forEach(function(el){el.textContent=timeAgo(el.dataset.time);});

// Category tab filter
function filterTab(btn,filter){
  document.querySelectorAll('.ctab').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  document.querySelectorAll('.ccard').forEach(function(c){
    var cat=c.dataset.category||'';
    var show=false;
    if(filter==='all'){show=true;}
    else if(filter==='Water'){show=cat==='Water Leakage'||cat==='Water Supply';}
    else if(filter==='other'){show=!MAJOR.includes(cat);}
    else{show=cat===filter;}
    c.style.display=show?'':'none';
  });
}

// GPS
function useGPS(){
  var btn=document.getElementById('gpsBtn');btn.textContent='⏳…';btn.disabled=true;
  navigator.geolocation.getCurrentPosition(function(p){
    var u=new URL(location.href);u.searchParams.set('lat',p.coords.latitude.toFixed(6));u.searchParams.set('lon',p.coords.longitude.toFixed(6));u.searchParams.set('radius','5');location.href=u;
  },function(){btn.textContent='❌ Denied';btn.disabled=false;});
}

// Drawer
var currentId=null;
function openDrawer(id){
  currentId=id;
  document.getElementById('overlay').style.display='block';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('dBody').innerHTML='<div class="dloading">Loading…</div>';
  fetch('/api/feed/detail?id='+id,{headers:{[CHEAD]:CSRF}})
  .then(function(r){return r.json();})
  .then(function(d){renderDrawer(d);})
  .catch(function(){document.getElementById('dBody').innerHTML='<p style="color:red;padding:20px">Failed to load.</p>';});
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').style.display='none';
  currentId=null;
}

function renderDrawer(d){
  var emoji=EMOJIS[d.category]||'📋';
  document.getElementById('dCatEmoji').textContent=emoji;
  document.getElementById('dCat').textContent=d.category;

  var sevCls={'CRITICAL':'#dc2626','HIGH':'#ea580c','MEDIUM':'#ca8a04','LOW':'#2563eb'};
  var sc=sevCls[d.severity]||'#2563eb';

  var media='';
  if(d.mediaUrl){d.mediaUrl.split(',').forEach(function(u){u=u.trim();if(u)media+='<img class="dthumb" src="'+u+'" onerror="this.style.display=\'none\'" loading="lazy"/>';});}

  var ai=d.aiSummary?'<div class="ai-card"><div class="ai-chip"><span class="ai-dot"></span>AI Summary — Llama 3.3</div><div class="ai-text">'+esc(d.aiSummary)+'</div>'+(d.aiReason?'<div style="font-size:.78rem;color:rgba(255,255,255,.5);font-style:italic;margin-top:8px">"'+esc(d.aiReason)+'"</div>':'')+'</div>':'';

  var upBtn='<button class="vbtn'+(d.upvotedByMe?' upvoted':'')+'" id="dVBtn" onclick="drawerUpvote('+d.id+')">'+(d.upvotedByMe?'✓ Upvoted':'👍 Upvote')+'</button>';
  var mapLink=d.latitude?'<a class="vmaplink" href="https://www.google.com/maps?q='+d.latitude+','+d.longitude+'" target="_blank">📍 Map</a>':'';

  var chain=d.blockchainHash?'<div class="chain-note">⛓️ On-chain: <a href="https://sepolia.etherscan.io/tx/'+d.blockchainHash+'" target="_blank">View TX</a></div>':'';

  var comHtml='';
  (d.comments||[]).forEach(function(c){
    comHtml+='<div class="com"><div class="cauth"><div class="cavatar">'+esc(c.author.charAt(0).toUpperCase())+'</div><span class="caname">'+esc(c.author)+'</span>'+(c.official?'<span class="offb">🏛️ Official</span>':'')+'<span class="ctime2">'+c.time+'</span></div><div class="ctext">'+esc(c.text)+'</div></div>';
  });

  document.getElementById('dBody').innerHTML=
    '<div style="height:4px;background:'+sc+';border-radius:4px;margin-bottom:20px"></div>'+
    '<div class="dtitle">'+esc(d.title)+'</div>'+
    '<div class="dmeta">Filed by <strong>'+esc(d.citizenName)+'</strong> · 📍 '+esc(d.location)+'</div>'+
    media+ai+
    '<div class="ddesc" id="dDesc">'+esc(d.description)+'</div>'+
    '<div class="dvote">'+upBtn+'<div><div class="vcnt" id="dVCnt">'+d.upvoteCount+'</div><div class="vlab">upvotes</div></div>'+mapLink+'</div>'+
    chain+
    '<div class="coms-title">💬 Comments ('+((d.comments||[]).length)+')</div>'+
    (comHtml||'<p style="color:#94a3b8;font-size:.88rem;padding:8px 0">No comments yet.</p>')+
    '<div class="cform"><textarea class="cinput" id="dComInput" placeholder="Add a comment…" maxlength="500"></textarea><br/><button class="csubmit" onclick="drawerComment('+d.id+')">Post Comment</button></div>';
}

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function drawerUpvote(id){
  var btn=document.getElementById('dVBtn');if(!btn)return;btn.disabled=true;
  fetch('/api/feed/upvote?complaintId='+id,{method:'POST',headers:{[CHEAD]:CSRF}})
  .then(function(r){return r.json();})
  .then(function(d){
    btn.className='vbtn'+(d.upvoted?' upvoted':'');
    btn.textContent=d.upvoted?'✓ Upvoted':'👍 Upvote';
    document.getElementById('dVCnt').textContent=d.count;
    // Update grid card too
    var card=document.querySelector('.ccard[data-id="'+id+'"]');
    if(card){card.querySelector('.vcount').textContent=d.count;}
  })
  .finally(function(){btn.disabled=false;});
}

function drawerComment(id){
  var inp=document.getElementById('dComInput');if(!inp)return;
  var txt=inp.value.trim();if(!txt)return;
  var p=new URLSearchParams({complaintId:id,text:txt});
  fetch('/api/feed/comment?'+p,{method:'POST',headers:{[CHEAD]:CSRF}})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.error){alert(d.error);return;}
    var cform=document.querySelector('.cform');
    var div=document.createElement('div');div.className='com';
    div.innerHTML='<div class="cauth"><div class="cavatar">'+d.author.charAt(0).toUpperCase()+'</div><span class="caname">'+esc(d.author)+'</span>'+(d.official?'<span class="offb">🏛️ Official</span>':'')+'<span class="ctime2">just now</span></div><div class="ctext">'+esc(d.text)+'</div>';
    cform.parentNode.insertBefore(div,cform);
    inp.value='';
  });
}
</script>
</body>
</html>
