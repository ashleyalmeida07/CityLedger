<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <title>Complaints Map - CityLedger</title>
    <link href="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/css/city-connect-wcopilot.webflow.633e33f7b.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Lato', sans-serif; background: #f4f7f6; margin: 0; }
        .dash-body { padding: 120px 5% 40px 5%; min-height: 70vh; max-width: 1400px; margin: 0 auto; }
        h2 { font-family: 'Urbanist', sans-serif; color: #0f3460; font-size: 2.4rem; font-weight: 800; margin-bottom: 8px; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #666; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #0f3460; }
        #map { width: 100%; height: 550px; border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-bar select { padding: 10px 16px; border-radius: 8px; border: 2px solid #e2e8f0; font-family: 'Lato', sans-serif; font-weight: 600; color: #333; cursor: pointer; }
        .filter-bar select:focus { outline: none; border-color: #0f3460; }
        .map-legend { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #666; font-weight: 600; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dash-body">
        <a href="/citizen/dashboard" class="back-link">← Back to Dashboard</a>
        <h2>Complaints Map</h2>
        <p style="color:#666; margin-bottom: 20px;">Interactive map showing all reported civic issues. Color-coded by severity.</p>

        <div class="filter-bar">
            <select id="filterCategory">
                <option value="">All Categories</option>
                <option>Roads</option><option>Water</option><option>Garbage</option><option>Electricity</option><option>Sewage</option><option>Public Safety</option><option>Other</option>
            </select>
            <select id="filterStatus">
                <option value="">All Statuses</option>
                <option value="FILED">Filed</option><option value="IN_PROGRESS">In Progress</option><option value="RESOLVED">Resolved</option>
            </select>
        </div>

        <div id="map"></div>

        <div class="map-legend">
            <div class="legend-item"><div class="legend-dot" style="background: #22c55e;"></div> LOW</div>
            <div class="legend-item"><div class="legend-dot" style="background: #f59e0b;"></div> HIGH</div>
            <div class="legend-item"><div class="legend-dot" style="background: #ef4444;"></div> CRITICAL</div>
            <div class="legend-item"><div class="legend-dot" style="background: #6b7280;"></div> Unassessed</div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67a4c8dcc89e958da293d681" type="text/javascript"></script>
    <script src="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/js/webflow.2ed69b183.js" type="text/javascript"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:inline="javascript">
        var complaints = [];
        /*[# th:each="c : ${complaints}"]*/
        complaints.push({
            id: [[${c.id}]],
            title: [[${c.title}]],
            category: [[${c.category}]],
            status: [[${c.status}]],
            severity: [[${c.severity}]],
            latitude: [[${c.latitude}]],
            longitude: [[${c.longitude}]]
        });
        /*[/]*/
        var map = L.map('map').setView([19.0760, 72.8777], 12); // Default: Mumbai
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var markers = [];
        var severityColors = { 'LOW': '#22c55e', 'HIGH': '#f59e0b', 'CRITICAL': '#ef4444' };

        function getColor(severity) { return severityColors[severity] || '#6b7280'; }

        function renderMarkers() {
            markers.forEach(function(m) { map.removeLayer(m); });
            markers = [];
            var catFilter = document.getElementById('filterCategory').value;
            var statusFilter = document.getElementById('filterStatus').value;

            complaints.forEach(function(c) {
                if (catFilter && c.category !== catFilter) return;
                if (statusFilter && c.status !== statusFilter) return;

                // Use latitude and longitude fields
                if (!c.latitude || !c.longitude) return;
                
                var lat = parseFloat(c.latitude);
                var lng = parseFloat(c.longitude);
                if (isNaN(lat) || isNaN(lng)) return;
                
                var color = getColor(c.severity);

                var marker = L.circleMarker([lat, lng], {
                    radius: 10, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.85
                }).addTo(map);

                marker.bindPopup(
                    '<div style="font-family: Urbanist, sans-serif;">' +
                    '<strong style="font-size: 1.1rem;">#CL-' + c.id + '</strong><br>' +
                    '<span>' + (c.title || 'No title') + '</span><br>' +
                    '<span style="color: #666;">Category: ' + (c.category || 'N/A') + '</span><br>' +
                    '<span style="color: #666;">Status: ' + c.status + '</span><br>' +
                    '<a href="/citizen/reports?id=' + c.id + '" style="color: #0f3460; font-weight: 700;">View Details →</a>' +
                    '</div>'
                );
                markers.push(marker);
            });

            if (markers.length > 0) {
                var group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        document.getElementById('filterCategory').addEventListener('change', renderMarkers);
        document.getElementById('filterStatus').addEventListener('change', renderMarkers);
        renderMarkers();
    </script>
</body>
</html>
