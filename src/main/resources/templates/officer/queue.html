<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <title>Complaint Queue - CityLedger</title>
    <link href="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/css/city-connect-wcopilot.webflow.633e33f7b.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Lato', sans-serif; background: #f4f7f6; margin: 0; }
        .dash-body { padding: 120px 5% 80px 5%; min-height: 70vh; max-width: 1400px; margin: 0 auto; }
        h2 { font-family: 'Urbanist', sans-serif; color: #1a1a2e; font-size: 2.4rem; font-weight: 800; margin-bottom: 8px; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #666; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #0f3460; }

        .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { text-align: left; padding: 14px 16px; font-family: 'Urbanist', sans-serif; color: #666; border-bottom: 2px solid #eee; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
        td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        tr:hover { background: #f8fafc; }

        .badge { display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; }
        .badge-open { background: #fee2e2; color: #991b1b; }
        .badge-in_progress { background: #fef08a; color: #a16207; }
        .badge-resolved { background: #dcfce7; color: #166534; }
        .badge-rejected { background: #f3f4f6; color: #6b7280; }
        .severity-LOW { background: #e0f2fe; color: #0284c7; }
        .severity-HIGH { background: #fed7aa; color: #c2410c; }
        .severity-CRITICAL { background: #fee2e2; color: #dc2626; animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .assign-form { display: flex; gap: 8px; align-items: center; }
        .assign-form select { padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.85rem; font-weight: 600; }
        .assign-form button { background: #0f3460; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
        .assign-form button:hover { background: #16213e; }

        .alert-success { background: #dcfce7; color: #166534; padding: 14px 20px; border-radius: 12px; margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        
        .sla-timer { font-weight: 700; font-family: 'Urbanist', sans-serif; font-size: 0.9rem; }
        .sla-green { color: #16a34a; }
        .sla-yellow { color: #ca8a04; }
        .sla-red { color: #dc2626; }
        .sla-blink { color: #dc2626; animation: pulse 1s infinite; }

        .title-link { color: #0f3460; text-decoration: none; cursor: pointer; font-weight: 600; transition: color 0.2s; }
        .title-link:hover { color: #16a34a; text-decoration: underline; }

        .drawer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); z-index: 999; backdrop-filter: blur(2px); }
        .drawer-overlay.open { display: block; }
        .drawer { position: fixed; top: 0; right: -480px; width: 460px; max-width: 90vw; height: 100%; background: white; z-index: 1000; box-shadow: -8px 0 40px rgba(0,0,0,0.12); transition: right 0.35s ease; padding: 36px; overflow-y: auto; }
        .drawer.open { right: 0; }
        .drawer-close { position: absolute; top: 20px; right: 20px; background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .drawer-close:hover { background: #e2e8f0; }
        .drawer h3 { font-family: 'Urbanist', sans-serif; font-size: 1.4rem; color: #0f3460; margin: 0 0 6px; font-weight: 800; }
        .drawer-label { font-family: 'Urbanist', sans-serif; font-weight: 700; color: #0f3460; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 20px; margin-bottom: 6px; }
        .drawer-summary { background: #f8fafc; border-radius: 12px; padding: 18px; font-size: 0.95rem; color: #333; line-height: 1.7; border: 1px solid #f0f0f0; }
        .drawer-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        .drawer-badge { display: inline-block; padding: 5px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; }
        .drawer-reason { background: #e8f4f8; color: #0f3460; padding: 10px 16px; border-radius: 10px; font-size: 0.88rem; margin-top: 10px; font-style: italic; }
        .drawer-loading { text-align: center; padding: 40px 0; color: #94a3b8; }
        .drawer-spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top: 3px solid #0f3460; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .dup-badge { background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; margin-left: 6px; white-space: nowrap; }

        /* ── AI Branding ── */
        .ai-tag { display: inline-flex; align-items: center; gap: 4px; background: #0f3460; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; vertical-align: middle; margin-left: 6px; font-family: 'Urbanist', sans-serif; }
        .ai-tag .ai-dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; display: inline-block; animation: ai-blink 1.5s ease-in-out infinite; }
        @keyframes ai-blink { 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
        .cat-ai { display: flex; align-items: center; gap: 6px; }
        .cat-ai-icon { width: 18px; height: 18px; background: #e8f0fe; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .cat-ai-icon svg { width: 10px; height: 10px; }

        .drawer-ai-card { background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%); border-radius: 12px; padding: 18px; margin-bottom: 18px; color: white; position: relative; overflow: hidden; }
        .drawer-ai-card::before { content: ''; position: absolute; top: -20px; right: -20px; width: 60px; height: 60px; background: rgba(255,255,255,0.04); border-radius: 50%; }
        .drawer-ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .drawer-ai-chip { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.12); padding: 3px 10px; border-radius: 14px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; font-family: 'Urbanist', sans-serif; }
        .drawer-ai-chip .dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; animation: ai-blink 1.5s ease-in-out infinite; display: inline-block; }
        .drawer-ai-model { font-size: 0.68rem; color: rgba(255,255,255,0.45); font-weight: 600; }
        .drawer-ai-summary { font-size: 0.92rem; color: rgba(255,255,255,0.85); line-height: 1.65; }
        .drawer-ai-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .drawer-ai-badge { padding: 5px 14px; border-radius: 8px; font-weight: 700; font-size: 0.78rem; font-family: 'Urbanist', sans-serif; }
        .drawer-ai-badge-cat { background: rgba(59,130,246,0.2); color: #93c5fd; border: 1px solid rgba(59,130,246,0.25); }
        .drawer-ai-badge-sev { background: rgba(250,204,21,0.15); color: #fde68a; border: 1px solid rgba(250,204,21,0.2); }
        .drawer-ai-reason { font-size: 0.82rem; color: rgba(255,255,255,0.55); font-style: italic; margin-top: 10px; }
        .drawer-ai-reason::before { content: '"'; }
        .drawer-ai-reason::after { content: '"'; }
        /* Officer card grid — same product-card style as citizen feed */
        .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;margin-top:8px}
        .qcard{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08);transition:.22s;display:flex;flex-direction:column;border:1px solid #f0f0f0}
        .qcard:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,.13)}
        .qimg{position:relative;width:100%;height:220px;overflow:hidden;flex-shrink:0;cursor:pointer}
        .qimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
        .qcard:hover .qimg img{transform:scale(1.04)}
        .qimg-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem}
        .sev-CRITICAL .qimg-ph{background:linear-gradient(135deg,#fef2f2,#fecaca)}
        .sev-HIGH .qimg-ph{background:linear-gradient(135deg,#fff7ed,#fed7aa)}
        .sev-MEDIUM .qimg-ph{background:linear-gradient(135deg,#fefce8,#fde68a)}
        .sev-LOW .qimg-ph,.sev-N_A .qimg-ph{background:linear-gradient(135deg,#eff6ff,#bfdbfe)}
        .qimg-sev{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:800;font-family:'Urbanist',sans-serif;backdrop-filter:blur(4px);z-index:2}
        .sev-CRITICAL .qimg-sev{background:rgba(220,38,38,.85);color:#fff}
        .sev-HIGH .qimg-sev{background:rgba(234,88,12,.85);color:#fff}
        .sev-MEDIUM .qimg-sev{background:rgba(202,138,4,.85);color:#fff}
        .sev-LOW .qimg-sev,.sev-N_A .qimg-sev{background:rgba(37,99,235,.85);color:#fff}
        .qimg-id{position:absolute;top:10px;right:10px;background:rgba(15,52,96,.82);color:#fff;padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:800;font-family:'Urbanist',sans-serif;backdrop-filter:blur(4px)}
        .qimg-sla{position:absolute;bottom:10px;left:10px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:800;font-family:'Urbanist',sans-serif;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px)}
        .qimg-dup{position:absolute;bottom:10px;right:10px;background:rgba(250,204,21,.9);color:#92400e;padding:3px 8px;border-radius:8px;font-size:.62rem;font-weight:800;font-family:'Urbanist',sans-serif}
        .qbody{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:5px}
        .qtitle{font-family:'Urbanist',sans-serif;font-weight:800;font-size:.98rem;color:#1a1a2e;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
        .qtitle:hover{color:#0f3460}
        .qcat{font-size:.78rem;color:#0f3460;font-weight:700;display:flex;align-items:center;gap:5px;margin-top:2px}
        .qloc{font-size:.75rem;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .qfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid #f8fafc;gap:8px;flex-wrap:wrap}
        .qstatus{padding:4px 10px;border-radius:6px;font-size:.7rem;font-weight:700;font-family:'Urbanist',sans-serif}
        .status-filed{background:#eff6ff;color:#2563eb}
        .status-in_progress{background:#fefce8;color:#ca8a04}
        .status-resolved{background:#f0fdf4;color:#16a34a}
        .status-rejected{background:#f1f5f9;color:#64748b}
        .qassign{display:flex;gap:6px;align-items:center;width:100%}
        .qassign select{flex:1;padding:6px 8px;border-radius:6px;border:1px solid #cbd5e1;font-size:.75rem;font-family:'Urbanist',sans-serif;font-weight:600;min-width:0;background:#f8fafc;color:#1e293b;appearance:none;cursor:pointer;}
        .qassign select:focus{outline:none;border-color:#3b82f6;}
        .qassign button{background:#0f172a;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-weight:700;cursor:pointer;font-size:.75rem;white-space:nowrap;font-family:'Urbanist',sans-serif;transition:0.2s}
        .qassign button:hover{background:#334155}
        .qworker{font-size:.78rem;color:#64748b;font-weight:600}
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dash-body">
        <a href="/officer/dashboard" class="back-link">← Back to Dashboard</a>
        <h2>Complaint Queue</h2>
        <p style="color:#666; margin-bottom: 24px;">Triage incoming complaints and assign field workers. SLA timers indicate urgency.</p>

        <div th:if="${param.assigned}" class="alert-success">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Complaint assigned to field worker successfully!
        </div>

        <!-- Category Tabs -->
        <div class="cats-wrap" style="margin-bottom:20px;display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;">
            <button class="cat-tab active" onclick="filterQueue('All', this)" style="padding:8px 16px;border-radius:20px;border:1px solid #0f3460;background:#0f3460;color:#fff;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif;white-space:nowrap;transition:.2s;">All Complaints</button>
            <button class="cat-tab" onclick="filterQueue('Pothole', this)" style="padding:8px 16px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;color:#475569;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif;white-space:nowrap;transition:.2s;">Pothole</button>
            <button class="cat-tab" onclick="filterQueue('Street Lamp', this)" style="padding:8px 16px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;color:#475569;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif;white-space:nowrap;transition:.2s;">Street Lamp</button>
            <button class="cat-tab" onclick="filterQueue('Garbage', this)" style="padding:8px 16px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;color:#475569;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif;white-space:nowrap;transition:.2s;">Garbage</button>
            <button class="cat-tab" onclick="filterQueue('Water Leakage', this)" style="padding:8px 16px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;color:#475569;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif;white-space:nowrap;transition:.2s;">Water Leak</button>
            <button class="cat-tab" onclick="filterQueue('Road Damage', this)" style="padding:8px 16px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;color:#475569;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif;white-space:nowrap;transition:.2s;">Road Damage</button>
            <button class="cat-tab" onclick="filterQueue('Other', this)" style="padding:8px 16px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;color:#475569;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif;white-space:nowrap;transition:.2s;">Other</button>
        </div>

        <!-- Card Grid -->
        <div class="qgrid" id="queueGrid" th:if="${!#lists.isEmpty(complaints)}">
            <div th:each="item : ${complaints}"
                 th:class="'qcard sev-' + ${!#strings.isEmpty(item.complaint.severity) ? #strings.toUpperCase(#strings.trim(item.complaint.severity)) : 'LOW'}"
                 th:data-category="${!#strings.isEmpty(item.complaint.category) ? item.complaint.category : 'General'}">

                <!-- Image zone — click goes to details -->
                <div class="qimg"
                     th:onclick="'window.location.href=\'/officer/complaint/' + ${item.complaint.id} + '\''"
                     style="cursor:pointer;">
                    <img th:if="${item.complaint.mediaUrl != null and item.complaint.mediaUrl != 'null' and item.complaint.mediaUrl != ''}"
                         th:src="${#strings.arraySplit(item.complaint.mediaUrl,',')[0]}"
                         alt="Photo" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"/>
                    <div th:if="${item.complaint.mediaUrl == null or item.complaint.mediaUrl == 'null' or item.complaint.mediaUrl == ''}"
                         class="qimg-ph qcat-emoji" th:data-cat="${item.complaint.category != null ? item.complaint.category : 'General'}">
                         <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </div>
                    <div class="qimg-ph qcat-emoji" style="display:none;" th:data-cat="${item.complaint.category != null ? item.complaint.category : 'General'}">
                         <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </div>

                    <span class="qimg-sev" th:text="${!#strings.isEmpty(item.complaint.severity) ? item.complaint.severity : 'LOW'}"></span>
                    <span class="qimg-id" th:text="'#' + ${item.complaint.id}"></span>
                    <span class="qimg-sla sla-timer" th:id="'sla-' + ${item.complaint.id}" th:data-created="${item.complaint.createdAt}">—</span>
                    <span th:if="${item.reportCount > 1}" class="qimg-dup" th:text="${item.reportCount} + ' reports'"></span>
                </div>

                <!-- Card body -->
                <div class="qbody">
                    <div class="qtitle"
                         th:onclick="'window.location.href=\'/officer/complaint/' + ${item.complaint.id} + '\''"
                         th:text="${!#strings.isEmpty(item.complaint.title) ? item.complaint.title : 'Untitled Issue'}" style="cursor:pointer;">Title</div>

                    <div class="qcat">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        <span th:text="${!#strings.isEmpty(item.complaint.category) ? item.complaint.category : 'General'}"></span>
                        
                    </div>

                    <div class="qloc" th:text="${!#strings.isEmpty(item.complaint.location) ? item.complaint.location : 'Location unknown'}"></div>

                    <div class="qfoot">
                        <span class="qstatus" th:classappend="'status-' + ${item.complaint.status != null ? #strings.toLowerCase(item.complaint.status.name()) : 'filed'}" th:text="${item.complaint.status != null ? item.complaint.status : 'FILED'}">FILED</span>
                        <span style="font-size:.75rem;color:#94a3b8;display:flex;align-items:center;gap:4px;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
                            <span th:text="${item.complaint.upvoteCount}">0</span>
                        </span>
                        <span style="font-size:.75rem;background:#e8f4f8;color:#0f3460;padding:4px 10px;border-radius:6px;font-weight:700;display:flex;align-items:center;gap:6px;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                            <span th:text="${item.reportCount} + ' reported'">1 reported</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(complaints)}"
             style="text-align:center;padding:60px 20px;color:#94a3b8;font-family:'Urbanist',sans-serif">
            <div style="font-size:3rem;margin-bottom:12px"></div>
            <h3 style="color:#64748b">Queue is clear!</h3>
            <p>All complaints have been triaged.</p>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67a4c8dcc89e958da293d681" type="text/javascript"></script>
    <script src="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/js/webflow.2ed69b183.js" type="text/javascript"></script>
    <script>

        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.remove('open');
            document.getElementById('summaryDrawer').classList.remove('open');
        }

        // SLA Timer: 48h from creation
        document.querySelectorAll('.sla-timer').forEach(function(el) {
            var created = new Date(el.getAttribute('data-created'));
            var deadline = new Date(created.getTime() + 48 * 60 * 60 * 1000);
            function update() {
                var now = new Date();
                var diff = deadline - now;
                if (diff <= 0) {
                    el.textContent = 'BREACHED';
                    el.className = 'sla-timer sla-blink';
                    return;
                }
                var hours = Math.floor(diff / 3600000);
                var mins = Math.floor((diff % 3600000) / 60000);
                el.textContent = hours + 'h ' + mins + 'm';
                if (hours > 24) el.className = 'sla-timer sla-green';
                else if (hours > 6) el.className = 'sla-timer sla-yellow';
                else el.className = 'sla-timer sla-red';
            }
            update();
            setInterval(update, 60000);
        });

        function filterQueue(cat, btn) {
            document.querySelectorAll('.cat-tab').forEach(b => {
                b.style.background = '#fff';
                b.style.color = '#475569';
                b.style.borderColor = '#e2e8f0';
            });
            btn.style.background = '#0f3460';
            btn.style.color = '#fff';
            btn.style.borderColor = '#0f3460';

            document.querySelectorAll('.qcard').forEach(card => {
                if (cat === 'All' || card.dataset.category === cat) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
