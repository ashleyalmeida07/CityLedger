<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <title>Alerts - CityLedger</title>
    <link href="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/css/city-connect-wcopilot.webflow.633e33f7b.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Lato', sans-serif; background: #f4f7f6; margin: 0; }
        .dash-body { padding: 120px 5% 80px 5%; min-height: 70vh; max-width: 1000px; margin: 0 auto; }
        h2 { font-family: 'Urbanist', sans-serif; color: #1a1a2e; font-size: 2.4rem; font-weight: 800; margin-bottom: 8px; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #666; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #0f3460; }

        .alert-card { background: white; border-radius: 14px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 16px; border-left: 5px solid #e74c3c; display: flex; justify-content: space-between; align-items: center; gap: 20px; transition: all 0.2s; }
        .alert-card.acked { opacity: 0.5; border-left-color: #d1d5db; }
        .alert-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .alert-card.severity-HIGH { border-left-color: #f59e0b; }
        .alert-card.severity-CRITICAL { border-left-color: #dc2626; animation: flashBorder 2s infinite; }
        @keyframes flashBorder { 0%, 100% { border-left-color: #dc2626; } 50% { border-left-color: #fca5a5; } }

        .alert-info { flex: 1; }
        .alert-info h4 { font-family: 'Urbanist', sans-serif; font-weight: 800; color: #1a1a2e; margin: 0 0 6px; font-size: 1.1rem; }
        .alert-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: #666; margin-top: 8px; }
        .alert-meta span { display: flex; align-items: center; gap: 4px; }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .severity-HIGH { background: #fed7aa; color: #c2410c; }
        .severity-CRITICAL { background: #fee2e2; color: #dc2626; }

        .ack-btn { background: #0f3460; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: 'Urbanist', sans-serif; white-space: nowrap; transition: all 0.2s; }
        .ack-btn:hover { background: #16213e; }
        .ack-btn.acked { background: #d1d5db; color: #666; cursor: default; }

        .empty-state { text-align: center; padding: 80px 20px; color: #999; }
        .section-label { font-family: 'Urbanist', sans-serif; font-weight: 800; color: #0f3460; font-size: 1.2rem; margin: 30px 0 16px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dash-body">
        <a href="/officer/dashboard" class="back-link">← Back to Dashboard</a>
        <h2>Critical Alerts</h2>
        <p style="color:#666; margin-bottom: 24px;">HIGH and CRITICAL severity complaints that need immediate attention. Last 20 alerts shown.</p>

        <div th:if="${alerts != null and !#lists.isEmpty(alerts)}">
            <div th:each="alert : ${alerts}" th:class="'alert-card severity-' + ${alert.severity}" th:id="'alert-' + ${alert.id}">
                <div class="alert-info">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span th:class="'badge severity-' + ${alert.severity}" th:text="${alert.severity}"></span>
                        <h4 th:text="${alert.title}"></h4>
                    </div>
                    <div class="alert-meta">
                        <span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            <span th:text="${alert.location}"></span>
                        </span>
                        <span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            <span th:text="${#temporals.format(alert.createdAt, 'MMM dd, HH:mm')}"></span>
                        </span>
                        <span th:if="${alert.category != null}">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                            <span th:text="${alert.category}"></span>
                        </span>
                    </div>
                </div>
                <button class="ack-btn" th:data-id="${alert.id}" onclick="ackAlert(this)">ACK</button>
            </div>
        </div>

        <div th:if="${alerts == null or #lists.isEmpty(alerts)}" class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <h3 style="font-family: 'Urbanist', sans-serif; color: #666; margin-top: 16px;">No critical alerts</h3>
            <p>All clear — no HIGH or CRITICAL complaints currently in the system.</p>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67a4c8dcc89e958da293d681" type="text/javascript"></script>
    <script src="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/js/webflow.2ed69b183.js" type="text/javascript"></script>
    <script>
        function ackAlert(btn) {
            if (btn.classList.contains('acked')) return;
            btn.classList.add('acked');
            btn.textContent = 'Acknowledged';
            btn.closest('.alert-card').classList.add('acked');
        }
    </script>
</body>
</html>
