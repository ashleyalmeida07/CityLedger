<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <title>My Complaints - CityLedger</title>
    <link href="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/css/city-connect-wcopilot.webflow.633e33f7b.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Lato', sans-serif; background: #f4f7f6; margin: 0; }
        .dash-body { padding: 120px 5% 80px 5%; min-height: 70vh; max-width: 1200px; margin: 0 auto; }
        h2 { font-family: 'Urbanist', sans-serif; color: #0f3460; font-size: 2.4rem; font-weight: 800; margin-bottom: 8px; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #666; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #0f3460; }

        .complaints-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-top: 30px; }
        .complaint-card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; transition: all 0.2s; cursor: pointer; text-decoration: none; display: block; color: inherit; }
        .complaint-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.08); border-color: #0f3460; }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .card-id { font-family: 'Urbanist', sans-serif; font-weight: 800; color: #0f3460; font-size: 1.1rem; }
        .card-date { font-size: 0.85rem; color: #999; }
        .card-title { font-weight: 700; color: #1a1a2e; margin-bottom: 12px; font-size: 1rem; line-height: 1.4; }
        .card-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .badge { display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; }
        .badge-open { background: #fee2e2; color: #991b1b; }
        .badge-in_progress { background: #fef08a; color: #a16207; }
        .badge-resolved { background: #dcfce7; color: #166534; }
        .badge-rejected { background: #f3f4f6; color: #6b7280; }
        .badge-category { background: #e0f2fe; color: #0284c7; }
        .severity-LOW { background: #e0f2fe; color: #0284c7; }
        .severity-HIGH { background: #fed7aa; color: #c2410c; }
        .severity-CRITICAL { background: #fee2e2; color: #dc2626; }

        .empty-state { text-align: center; padding: 80px 20px; }
        .empty-state svg { margin-bottom: 16px; }
        .empty-state h3 { font-family: 'Urbanist', sans-serif; color: #666; font-weight: 700; }
        .empty-state a { display: inline-block; margin-top: 16px; background: #0f3460; color: white; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dash-body">
        <a href="/citizen/dashboard" class="back-link">← Back to Dashboard</a>
        <h2>My Complaints</h2>
        <p style="color:#666; margin-bottom: 0;">All civic issues you have reported. Click any card to track its full status.</p>

        <div class="complaints-grid" th:if="${complaints != null and !#lists.isEmpty(complaints)}">
            <a th:each="c : ${complaints}" th:href="@{/citizen/track(id=${c.id})}" class="complaint-card">
                <div class="card-top">
                    <span class="card-id" th:text="'#CL-' + ${c.id}"></span>
                    <span class="card-date" th:text="${#temporals.format(c.createdAt, 'MMM dd, yyyy')}"></span>
                </div>
                <div class="card-title" th:text="${c.title}"></div>
                <div class="card-badges">
                    <span th:class="'badge badge-' + ${#strings.toLowerCase(c.status.name())}" th:text="${c.status}"></span>
                    <span th:if="${c.category != null}" class="badge badge-category" th:text="${c.category}"></span>
                    <span th:if="${c.severity != null}" th:class="'badge severity-' + ${c.severity}" th:text="${c.severity}"></span>
                </div>
            </a>
        </div>

        <div th:if="${complaints == null or #lists.isEmpty(complaints)}" class="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            <h3>No complaints filed yet</h3>
            <p style="color: #999;">Report your first civic issue and it will appear here.</p>
            <a href="/citizen/report">+ Report an Issue</a>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67a4c8dcc89e958da293d681" type="text/javascript"></script>
    <script src="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/js/webflow.2ed69b183.js" type="text/javascript"></script>
</body>
</html>
