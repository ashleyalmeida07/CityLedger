<!DOCTYPE html>
<html data-wf-domain="city-connect-wcopilot.webflow.io" data-wf-page="67a4c8dcc89e958da293d70a"
    data-wf-site="67a4c8dcc89e958da293d681" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Admin Dashboard - CityLedger</title>
    <link href="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/css/city-connect-wcopilot.webflow.633e33f7b.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Lato', sans-serif; background: #f4f7f6; margin: 0; }
        .dashboard-container { padding: 120px 5% 80px 5%; min-height: 80vh; max-width: 1200px; margin: 0 auto; }
        
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-section h2 { font-family: 'Urbanist', sans-serif; color: #0f3460; font-size: 2.5rem; font-weight: 800; margin: 0; }
        .badge-admin { background: #0f3460; color: white; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; }
        
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
        .stat-card h3 { margin: 0 0 10px 0; color: #666; font-size: 1rem; font-family: 'Urbanist', sans-serif; }
        .stat-card .value { font-size: 2.5rem; font-weight: 800; color: #0f3460; font-family: 'Urbanist', sans-serif; margin: 0; }
        
        .card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .section-title { font-family: 'Urbanist', sans-serif; color: #0f3460; font-size: 1.5rem; font-weight: 800; margin: 0 0 20px 0; }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { text-align: left; padding: 16px; font-family: 'Urbanist', sans-serif; color: #666; border-bottom: 2px solid #eee; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
        td { padding: 16px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        
        .user-cell { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .user-name { font-weight: 700; color: #1a1a2e; margin: 0; }
        .user-email { color: #666; font-size: 0.9rem; margin: 0; }
        
        .role-badge, .badge-status { display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; }
        .role-CITIZEN { background: #e0f2fe; color: #0284c7; }
        .role-FIELD_WORKER { background: #fef08a; color: #a16207; }
        .role-OFFICER { background: #dcfce7; color: #166534; }
        .role-ADMIN { background: #f3e8ff; color: #7e22ce; }
        
        .status-PENDING { background: #fee2e2; color: #991b1b; }
        .status-IN_PROGRESS { background: #fef08a; color: #a16207; }
        .status-RESOLVED { background: #dcfce7; color: #166534; }
        
        .role-select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Lato', sans-serif; font-weight: 600; color: #333; background: #fff; cursor: pointer; outline: none; }
        .role-select:focus { border-color: #0f3460; }
        
        .btn-update { background: #0f3460; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: background 0.2s; font-family: 'Lato', sans-serif; }
        .btn-update:hover { background: #1a1a2e; }
        
        .alert-success { background: #dcfce7; color: #166534; padding: 16px; border-radius: 12px; margin-bottom: 24px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dashboard-container">
        <div class="header-section">
            <h2>Admin Overview</h2>
            <span class="badge-admin">Admin Privileges</span>
        </div>
        
        <div th:if="${param.success}" class="alert-success">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            User role successfully updated!
        </div>

        <div class="analytics-grid">
            <div class="stat-card">
                <h3>Total Complaints</h3>
                <p class="value" th:text="${totalComplaints}">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <p class="value" th:text="${pendingComplaints}" style="color: #e74c3c;">0</p>
            </div>
            <div class="stat-card">
                <h3>In Progress</h3>
                <p class="value" th:text="${inProgressComplaints}" style="color: #f39c12;">0</p>
            </div>
            <div class="stat-card">
                <h3>Resolved</h3>
                <p class="value" th:text="${resolvedComplaints}" style="color: #27ae60;">0</p>
            </div>
        </div>

        <div class="card">
            <h3 class="section-title">Global Complaints Stream</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Citizen</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="complaint : ${complaints}">
                            <td th:text="${'#' + complaint.id}"></td>
                            <td th:text="${complaint.description}"></td>
                            <td th:text="${complaint.category}"></td>
                            <td>
                                <span th:class="'badge-status status-' + ${complaint.status}" th:text="${complaint.status}"></span>
                            </td>
                            <td th:text="${complaint.citizen.name}"></td>
                            <td th:text="${#temporals.format(complaint.createdAt, 'MMM dd, yyyy')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(complaints)}">
                            <td colspan="6" style="text-align: center; color: #666; padding: 30px;">No complaints found in the system.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h3 class="section-title">User Role Management</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Current Role</th>
                            <th>Change Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td>
                                <div class="user-cell">
                                    <img th:src="${user.pictureUrl}" class="user-avatar" th:data-fallback-name="${user.name}" onerror="this.src='https://ui-avatars.com/api/?name=' + encodeURIComponent(this.getAttribute('data-fallback-name')) + '&background=f0f0f0&color=333'" alt="Avatar" />
                                    <div>
                                        <p class="user-name" th:text="${user.name}"></p>
                                        <p class="user-email" th:text="${user.email}"></p>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span th:class="'role-badge role-' + ${user.role}" th:text="${user.role}"></span>
                            </td>
                            <td>
                                <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" style="margin: 0; display: flex; gap: 10px;">
                                    <select name="role" class="role-select">
                                        <option th:each="roleOpt : ${roles}" 
                                                th:value="${roleOpt}" 
                                                th:text="${roleOpt}" 
                                                th:selected="${roleOpt == user.role}">
                                        </option>
                                    </select>
                                    <button type="submit" class="btn-update">Update</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67a4c8dcc89e958da293d681" type="text/javascript"></script>
    <script src="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/js/webflow.2ed69b183.js" type="text/javascript"></script>
</body>
</html>
