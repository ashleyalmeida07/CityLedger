<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <title>My Tasks - CityLedger</title>
    <link href="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/css/city-connect-wcopilot.webflow.633e33f7b.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Lato', sans-serif; background: #f4f7f6; margin: 0; }
        .dash-body { padding: 120px 5% 80px 5%; min-height: 70vh; max-width: 1100px; margin: 0 auto; }
        h2 { font-family: 'Urbanist', sans-serif; color: #1a1a2e; font-size: 2.4rem; font-weight: 800; margin-bottom: 8px; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #666; text-decoration: none; font-weight: 600; }
        .back-link:hover { color: #0f3460; }

        .task-list { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
        .task-card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; transition: all 0.2s; text-decoration: none; color: inherit; border: 2px solid transparent; }
        .task-card:hover { border-color: #ca8a04; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }

        .cat-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .cat-Roads { background: #fee2e2; }
        .cat-Water { background: #dbeafe; }
        .cat-Garbage { background: #dcfce7; }
        .cat-Electricity { background: #fef08a; }
        .cat-Sewage { background: #f3e8ff; }
        .cat-default { background: #f3f4f6; }

        .task-info h4 { font-family: 'Urbanist', sans-serif; font-weight: 800; color: #1a1a2e; margin: 0 0 6px; font-size: 1.05rem; }
        .task-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: #666; }
        .task-meta span { display: flex; align-items: center; gap: 4px; }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .severity-LOW { background: #e0f2fe; color: #0284c7; }
        .severity-HIGH { background: #fed7aa; color: #c2410c; }
        .severity-CRITICAL { background: #fee2e2; color: #dc2626; }
        .status-FILED { background: #fee2e2; color: #991b1b; }
        .status-IN_PROGRESS { background: #fef08a; color: #a16207; }
        .status-RESOLVED { background: #dcfce7; color: #166534; }

        .task-right { text-align: right; }
        .sla-timer { font-family: 'Urbanist', sans-serif; font-weight: 800; font-size: 1.1rem; }
        .sla-green { color: #16a34a; }
        .sla-yellow { color: #ca8a04; }
        .sla-red { color: #dc2626; }
        .sla-blink { color: #dc2626; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .distance { font-size: 0.85rem; color: #999; margin-top: 6px; }

        .empty-state { text-align: center; padding: 80px 20px; }
        .empty-state h3 { font-family: 'Urbanist', sans-serif; color: #666; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dash-body">
        <a href="/field-worker/dashboard" class="back-link">← Back to Dashboard</a>
        <h2>My Assigned Tasks</h2>
        <p style="color:#666; margin-bottom: 0;">All complaints assigned to you. Click any task for full details and status updates.</p>

        <div class="task-list" th:if="${tasks != null and !#lists.isEmpty(tasks)}">
            <a th:each="t : ${tasks}" th:href="@{/field-worker/task/{id}(id=${t.id})}" class="task-card">
                <div th:class="'cat-icon cat-' + (${t.category != null ? t.category : 'default'})">
                    <span th:switch="${t.category}">
                        <span th:case="'Roads'">️</span>
                        <span th:case="'Water'"></span>
                        <span th:case="'Garbage'">️</span>
                        <span th:case="'Electricity'"></span>
                        <span th:case="'Sewage'"></span>
                        <span th:case="*"></span>
                    </span>
                </div>
                <div class="task-info">
                    <h4 th:text="'#CL-' + ${t.id} + ' — ' + ${t.title}"></h4>
                    <div class="task-meta">
                        <span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            <span th:text="${t.location}" style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;"></span>
                        </span>
                        <span th:if="${t.severity != null}" th:class="'badge severity-' + ${t.severity}" th:text="${t.severity}"></span>
                        <span th:class="'badge status-' + ${t.status.name()}" th:text="${t.status}"></span>
                    </div>
                </div>
                    <div class="task-right">
                        <div class="sla-timer" th:data-created="${t.createdAt}">—</div>
                        <div class="distance" th:data-location="${t.location}">Calculating...</div>
                        <!-- AI Completion Score -->
                        <div th:if="${t.status.name() == 'RESOLVED' and t.completionScore != null}" style="margin-top:8px;padding:6px 12px;border-radius:6px;font-weight:700;font-size:0.85rem;text-align:center;font-family:'Urbanist',sans-serif;" th:classappend="${t.completionScore >= 70 ? 'background:#d1fae5;color:#065f46;' : 'background:#fed7aa;color:#c2410c;'}">
                            <span th:text="'AI Score: ' + ${t.completionScore} + '/100'">AI Score: 0/100</span>
                        </div>
                    </div>
            </a>
        </div>

        <div th:if="${tasks == null or #lists.isEmpty(tasks)}" class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            <h3>No tasks assigned yet</h3>
            <p style="color: #999;">When an officer assigns you a complaint, it will appear here.</p>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67a4c8dcc89e958da293d681" type="text/javascript"></script>
    <script src="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/js/webflow.2ed69b183.js" type="text/javascript"></script>
    <script>
        // SLA Timers
        document.querySelectorAll('.sla-timer').forEach(function(el) {
            var created = new Date(el.getAttribute('data-created'));
            var deadline = new Date(created.getTime() + 48 * 3600000);
            function update() {
                var diff = deadline - new Date();
                if (diff <= 0) { el.textContent = 'BREACHED'; el.className = 'sla-timer sla-blink'; return; }
                var h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000);
                el.textContent = h + 'h ' + m + 'm';
                el.className = 'sla-timer ' + (h > 24 ? 'sla-green' : h > 6 ? 'sla-yellow' : 'sla-red');
            }
            update(); setInterval(update, 60000);
        });

        // GPS distance calculation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
                var lat1 = pos.coords.latitude, lon1 = pos.coords.longitude;
                document.querySelectorAll('.distance').forEach(function(el) {
                    var loc = el.getAttribute('data-location');
                    var parts = loc ? loc.split(',') : null;
                    if (parts && parts.length >= 2 && !isNaN(parseFloat(parts[0]))) {
                        var lat2 = parseFloat(parts[0]), lon2 = parseFloat(parts[1]);
                        var R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
                        var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
                        var d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                        el.textContent = d.toFixed(1) + ' km away';
                    } else { el.textContent = loc; }
                });
            }, function() {
                document.querySelectorAll('.distance').forEach(function(el) { el.textContent = el.getAttribute('data-location'); });
            });
        }
    </script>
</body>
</html>
