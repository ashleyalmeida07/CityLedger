<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <title>Field Worker Dashboard - CityLedger</title>
    <link href="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/css/city-connect-wcopilot.webflow.633e33f7b.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Lato', sans-serif; background: #f4f7f6; margin: 0; }
        .dash-body { padding: 120px 5% 80px 5%; min-height: 70vh; max-width: 1200px; margin: 0 auto; }
        .role-badge { background: #ca8a04; color: white; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-left: 12px; }
        h2 { font-family: 'Urbanist', sans-serif; color: #1a1a2e; font-size: 2.4rem; font-weight: 800; margin-bottom: 8px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; margin-right: 12px; border: 2px solid #ca8a04; }
        .dash-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 30px; }
        .user-info { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 24px; }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .kpi-card { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; transition: transform 0.2s; }
        .kpi-card:hover { transform: translateY(-4px); }
        .kpi-card h3 { font-size: 3rem; font-weight: 800; color: #1a1a2e; font-family: 'Urbanist', sans-serif; margin: 0 0 8px; }
        .kpi-card p { color: #666; font-weight: 600; margin: 0; }

        .quick-link { display: flex; align-items: center; gap: 16px; background: #ca8a04; color: white; border-radius: 14px; padding: 20px 28px; text-decoration: none; font-weight: 700; font-family: 'Urbanist', sans-serif; font-size: 1.1rem; transition: all 0.2s; margin-top: 30px; }
        .quick-link:hover { background: #a16207; transform: translateY(-2px); }
        .quick-link svg { flex-shrink: 0; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="dash-body">
        <div class="dash-header">
            <div>
                <h2>Field Operations</h2>
                <p style="color:#666; font-size:1.1rem; max-width: 600px; line-height: 1.6;">Welcome back, <strong th:text="${user != null ? user.attributes['name'] : 'Worker'}">Worker</strong>. View your assigned tasks, update statuses, and resolve civic complaints on-site.</p>
            </div>
            <div style="text-align: right;">
                <div class="user-info">
                    <img th:if="${user != null}" th:src="${user.attributes['picture']}" class="avatar" alt="avatar"/>
                    <span class="role-badge">FIELD WORKER</span>
                </div>
            </div>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <h3 th:text="${totalTasks}">0</h3>
                <p>Total Assigned</p>
            </div>
            <div class="kpi-card">
                <h3 th:text="${pendingTasks}" style="color: #ca8a04;">0</h3>
                <p>Pending / Active</p>
            </div>
            <div class="kpi-card">
                <h3 th:text="${completedTasks}" style="color: #16a34a;">0</h3>
                <p>Completed</p>
            </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr; gap:24px; margin-top:30px;">
            <div style="background:white; border-radius:16px; padding:32px; box-shadow:0 4px 20px rgba(0,0,0,0.05); height: 350px; display:flex; flex-direction:column; align-items:center;">
                <h3 style="font-family:'Urbanist',sans-serif; color:#1a1a2e; font-size:1.4rem; font-weight:800; margin-bottom:16px;">Task Completion Progress</h3>
                <div style="width:100%; max-width:400px; flex-grow:1; position:relative;">
                    <canvas id="fwTaskChart"></canvas>
                </div>
            </div>
        </div>

        <a href="/field-worker/tasks" class="quick-link">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            View My Task List →
        </a>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67a4c8dcc89e958da293d681" type="text/javascript"></script>
    <script src="https://cdn.prod.website-files.com/67a4c8dcc89e958da293d681/js/webflow.2ed69b183.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        const pending = [[${pendingTasks != null ? pendingTasks : 0}]];
        const completed = [[${completedTasks != null ? completedTasks : 0}]];
        
        new Chart(document.getElementById('fwTaskChart'), {
            type: 'doughnut',
            data: {
                labels: ['Pending / Active Tasks', 'Completed Tasks'],
                datasets: [{
                    data: [pending, completed],
                    backgroundColor: ['#ca8a04', '#16a34a'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: "'Urbanist', sans-serif" } } } } }
        });
    </script>
</body>
</html>
